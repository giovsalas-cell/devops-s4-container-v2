trigger:
  branches:
    include:
      - main

variables:
  ACR_NAME: "acrs4"
  IMAGE_NAME: "myapp-nginx-s4"
  SERVICE_CONNECTION_NAME: "myapps-devops-s4-v2"

jobs:
  - job: BuildAndPush
    pool:
      vmImage: "ubuntu-latest"
    steps:
      - task: Docker@2
        inputs:
          command: "buildAndPush"
          containerRegistry: "$(SERVICE_CONNECTION_NAME)"
          repository: "$(IMAGE_NAME)"
          dockerfile: "**/Dockerfile"
          tags: |
            latest
        displayName: "Build and Push Docker Image"
